<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101310">
  <title>Casualties Unknown</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      background: #101310;
      color: #f0eee4;
      --accent: #c4e15a;
      --muted: #a4aa9a;
      --line: #394137;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(ellipse at 50% 45%, #252b21 0, #171b16 48%, #101310 100%);
    }
    #stage {
      position: relative;
      width: min(100%, 1280px);
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #050605;
      border: 1px solid #495044;
      box-shadow: 0 24px 80px #0009;
    }
    #game { display: block; width: 100%; height: 100%; outline: none; }
    #cover {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(120deg, #121710ed, #171b16e8 55%, #1c2119ed);
    }
    .panel { width: min(100%, 440px); text-align: center; }
    .eyebrow {
      margin: 0 0 14px;
      color: var(--accent);
      font: 700 11px/1.4 "Courier New", monospace;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font: 700 clamp(30px, 6vw, 54px)/0.98 Georgia, serif;
    }
    .subtitle { margin: 16px 0 28px; color: var(--muted); font-size: 15px; }
    button {
      min-height: 46px;
      padding: 0 24px;
      border: 1px solid var(--accent);
      border-radius: 2px;
      background: var(--accent);
      color: #171b12;
      font: 700 14px "Trebuchet MS", "Segoe UI", sans-serif;
      cursor: pointer;
    }
    button:hover { background: #d6ef7d; }
    button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    button:disabled { cursor: progress; opacity: 0.7; }
    progress { display: block; width: min(100%, 280px); height: 5px; margin: 22px auto 0; accent-color: var(--accent); }
    #status { min-height: 1.4em; margin: 16px 0 0; color: var(--muted); font-size: 13px; }
    #error { display: none; margin-top: 16px; color: #ff9a82; font: 12px/1.5 "Courier New", monospace; overflow-wrap: anywhere; }
    #fullscreen {
      position: absolute;
      right: 12px;
      bottom: 12px;
      min-height: 36px;
      padding: 0 14px;
      border-color: #ffffff55;
      background: #111a;
      color: #fff;
    }
    @media (max-width: 600px) {
      body { padding: 10px; }
      #stage { width: 100%; }
      .subtitle { margin: 12px 0 18px; font-size: 13px; }
      .panel { width: min(100%, 360px); }
    }
  </style>
</head>
<body>
  <main id="stage" aria-label="Casualties Unknown game">
    <canvas id="game" width="960" height="540" tabindex="0"></canvas>
    <section id="cover">
      <div class="panel">
        <p class="eyebrow">Orsoniks presents</p>
        <h1>Casualties<br>Unknown</h1>
        <p class="subtitle">The game loads its split files from this page.</p>
        <button id="play" type="button">Play</button>
        <progress id="progress" hidden></progress>
        <p id="status" role="status">Ready</p>
        <div id="error" role="alert"></div>
      </div>
    </section>
    <button id="fullscreen" type="button" hidden>Fullscreen</button>
  </main>
  <script>
    'use strict';

    const canvas = document.getElementById('game');
    const playButton = document.getElementById('play');
    const progress = document.getElementById('progress');
    const status = document.getElementById('status');
    const errorBox = document.getElementById('error');
    const objectUrls = [];

    function setStatus(message) {
      status.textContent = message;
    }

    function compressedAssetStream(asset) {
      let partIndex = 0;
      let reader;

      return new ReadableStream({
        async pull(controller) {
          try {
            while (true) {
              if (!reader) {
                if (partIndex >= asset.parts.length) {
                  controller.close();
                  return;
                }
                const url = new URL(`assets/${asset.parts[partIndex]}`, document.baseURI);
                const response = await fetch(url);
                if (!response.ok || !response.body) {
                  throw new Error(`Could not load ${asset.parts[partIndex]} (${response.status}).`);
                }
                reader = response.body.getReader();
              }

              const { done, value } = await reader.read();
              if (done) {
                reader.releaseLock();
                reader = undefined;
                partIndex += 1;
                continue;
              }
              controller.enqueue(value);
              return;
            }
          } catch (error) {
            controller.error(error);
          }
        },
        async cancel(reason) {
          if (reader) await reader.cancel(reason);
        }
      });
    }

    async function unpack(manifest, key, asBytes = false) {
      const asset = manifest[key];
      if (!asset || !Array.isArray(asset.parts) || asset.parts.length === 0) {
        throw new Error(`The asset list for ${key} is missing.`);
      }

      const decompressed = compressedAssetStream(asset).pipeThrough(new DecompressionStream('gzip'));
      const response = new Response(decompressed);
      if (asBytes) {
        const bytes = new Uint8Array(await response.arrayBuffer());
        if (bytes.byteLength !== asset.bytes) throw new Error(`The ${key} file is incomplete.`);
        return bytes;
      }

      const blob = await response.blob();
      if (blob.size !== asset.bytes) throw new Error(`The ${key} file is incomplete.`);
      const url = URL.createObjectURL(new Blob([blob], { type: asset.mime }));
      objectUrls.push(url);
      return url;
    }

    function loadScript(url) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = url;
        script.onload = resolve;
        script.onerror = () => reject(new Error('Could not load the Unity game script.'));
        document.body.appendChild(script);
      });
    }

    playButton.addEventListener('click', async () => {
      playButton.disabled = true;
      progress.hidden = false;
      errorBox.style.display = 'none';

      try {
        if (!window.WebAssembly || !window.DecompressionStream) {
          throw new Error('Use a current browser with WebAssembly and gzip decompression support.');
        }
        const gl = document.createElement('canvas').getContext('webgl2');
        if (!gl) throw new Error('WebGL 2 is unavailable. Enable browser hardware acceleration.');
        const loseContext = gl.getExtension('WEBGL_lose_context');
        if (loseContext) loseContext.loseContext();

        setStatus('Loading game file list...');
        const manifestResponse = await fetch(new URL('assets/manifest.json', document.baseURI));
        if (!manifestResponse.ok) throw new Error('Could not load assets/manifest.json.');
        const manifest = await manifestResponse.json();

        setStatus('Loading game loader...');
        const loader = await unpack(manifest, 'loader');
        progress.value = 0.08;
        await loadScript(loader);

        setStatus('Loading game engine...');
        const framework = await unpack(manifest, 'framework');
        const code = await unpack(manifest, 'code', true);
        progress.value = 0.2;

        setStatus('Loading game data (about 240 MB)...');
        const data = await unpack(manifest, 'data');
        progress.value = 0.45;

        setStatus('Starting game...');
        const instance = await createUnityInstance(canvas, {
          dataUrl: data,
          frameworkUrl: framework,
          codeUrl: 'embedded.wasm',
          wasmBinary: code,
          streamingAssetsUrl: '',
          companyName: 'Orsoniks',
          productName: 'CasualtiesUnknown',
          productVersion: '1.0',
          cacheControl: () => 'no-store',
          showBanner: (message, type) => {
            if (type === 'error') setStatus(message);
            else console.warn(message);
          }
        }, value => {
          progress.value = 0.45 + 0.55 * value;
        });

        document.getElementById('cover').style.display = 'none';
        const fullscreen = document.getElementById('fullscreen');
        fullscreen.hidden = false;
        fullscreen.addEventListener('click', () => instance.SetFullscreen(1));
        canvas.focus();
      } catch (error) {
        errorBox.textContent = error instanceof Error ? error.message : String(error);
        errorBox.style.display = 'block';
        setStatus('Could not start the game.');
        progress.hidden = true;
        playButton.disabled = false;
        console.error(error);
      }
    });

    window.addEventListener('pagehide', () => objectUrls.forEach(URL.revokeObjectURL));
  </script>
</body>
</html>
